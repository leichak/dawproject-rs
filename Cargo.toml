[package]
name = "dawproject-rs"
version = "0.1.1"
authors = ["Dan K <dankaczor@icloud.com>"]
edition = "2021"

description = "Open exchange format for user data between Digital Audio Workstations (DAWs) based on DawProject in Rust."
homepage = "https://github.com/leichak"
documentation = "https://github.com/leichak/dawproject-rs/README.md"
repository = "https://github.com/leichak/dawproject-rs"
readme = "README.md"
license-file = "LICENSE"

[dependencies]
quick-xml = { version = "0.39.0", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
zip = "2.4"
strum = { version = "0.28", features = ["derive"] }
fake = { version = "5.1", features = ["derive", "always-true-rng"] }
once_cell = "1.21.3"
rand = "0.9.1"
